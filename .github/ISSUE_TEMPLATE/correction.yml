name: Report a correction
description: Correct paper metadata, links, classification, or presentation.
title: "[Correction] (paper title here)"
body:
  - type: input
    id: entry
    attributes:
      label: What needs correction?
      description: Give the paper title, section name, or repository link so we can locate it.
      placeholder: Paper title, section name, or URL
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should be changed?
      description: Briefly describe the problem and the correct information or placement.
      placeholder: |
        The current entry says ...; it should be ...
        Example: The current entry lacks an implementation link; the official implementation is available at ...
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Supporting link (optional)
      description: Add an official paper, publisher, project, or correction page when available.
      placeholder: https://...
