name: Suggest a paper
description: Suggest a paper for the collection.
title: "[New] (paper title here)"
body:
  - type: input
    id: link
    attributes:
      label: Paper link
      description: Link to the paper on a publisher, proceedings, arXiv, OpenReview, or author-hosted page. We will verify the title, authors, year, and venue.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Where does it belong?
      description: Select every broad topic that applies. See All papers for the current organization.
      multiple: true
      options:
        - Test-Time Learning
        - Test-Time Scaling
        - Learning and Scaling
        - Applications
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Relevance to test-time intelligence
      description: Briefly describe how the paper relates to improvement during deployment.
      placeholder: This paper updates ... during deployment to improve ...
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Official implementation (optional)
      description: Add a code or project link identified by the paper or its authors.
      placeholder: https://github.com/...
  - type: textarea
    id: new_classification
    attributes:
      label: New classification (optional)
      description: If a clearer classification is needed, suggest its name and briefly explain what it would cover.
      placeholder: "Proposed classification: what it covers"
